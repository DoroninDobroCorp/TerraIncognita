<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Debug Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial; }
    #map { width: 100%; height: 600px; margin-bottom: 20px; }
    #info { background: #f0f0f0; padding: 15px; border-radius: 5px; }
    .stat { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Debug Map View</h1>
  <div id="info">
    <div class="stat">Статус: <span id="status">Загрузка...</span></div>
    <div class="stat">GeoJSON features: <span id="feature-count">-</span></div>
    <div class="stat">Leaflet layers: <span id="layer-count">-</span></div>
    <div class="stat">Реальных полигонов на карте: <span id="polygon-count">-</span></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([42.0, 19.3], 11);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    document.getElementById('status').textContent = 'Загружаем GeoJSON...';

    fetch('../data/isolated_unmapped_buildings.geojson')
      .then(response => response.json())
      .then(geojson => {
        document.getElementById('feature-count').textContent = geojson.features.length;
        document.getElementById('status').textContent = 'Добавляем на карту...';
        
        const layer = L.geoJSON(geojson, {
          style: () => ({
            color: '#ff0000',
            weight: 2,
            fillColor: '#ff0000',
            fillOpacity: 0.5
          }),
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {};
            layer.bindPopup(`
              Dist: ${props.dist_to_osm_m?.toFixed(0)}m<br>
              Area: ${props.area_m2?.toFixed(1)}m²<br>
              Rect: ${props.rectangularity?.toFixed(2)}
            `);
          }
        }).addTo(map);
        
        // Подсчитываем слои
        let totalLayers = 0;
        let polygonCount = 0;
        
        map.eachLayer(l => {
          totalLayers++;
          if (l.feature) polygonCount++;
        });
        
        // Подсчитываем через GeoJSON layer
        let geoJsonPolygons = 0;
        layer.eachLayer(l => {
          geoJsonPolygons++;
        });
        
        document.getElementById('layer-count').textContent = totalLayers;
        document.getElementById('polygon-count').textContent = geoJsonPolygons;
        
        if (geoJsonPolygons > 0) {
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
          document.getElementById('status').textContent = '✓ Готово!';
        } else {
          document.getElementById('status').textContent = '⚠ Полигоны не добавлены!';
        }
      })
      .catch(err => {
        document.getElementById('status').textContent = '✗ Ошибка: ' + err.message;
        console.error(err);
      });
  </script>
</body>
</html>

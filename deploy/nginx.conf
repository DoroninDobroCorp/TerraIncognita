# /etc/nginx/sites-available/terra — TLS terminated by nginx (certbot), app on 127.0.0.1:8000.
# Set TERRA_TRUSTED_PROXY_HOPS=1 in the app so rate limits see the real client address.
server {
    listen 80;
    server_name terra.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;  # nginx >= 1.25.1; on older versions write `listen 443 ssl http2;` instead
    server_name terra.example.com;
    # ssl_certificate / ssl_certificate_key managed by certbot

    # Bot noise: drop the connection without logging.
    location ~* (^|/)(\.env|\.git|\.aws|wp-admin|wp-login|xmlrpc\.php|phpinfo|phpmyadmin|cgi-bin) {
        access_log off;
        return 444;
    }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8000; access_log off; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:8000; access_log off; }

    client_max_body_size 300k;  # a little above the app's own 256 KB cap

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
